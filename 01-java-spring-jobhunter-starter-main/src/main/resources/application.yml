server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: jobhunter

  profiles:
    # Mặc định kích hoạt profile 'dev' khi chạy local nếu không truyền SPRING_PROFILES_ACTIVE
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Tự động nạp file application-local.yml (nếu có trên máy cá nhân)
  # File này được gitignore, không bao giờ bị đẩy lên GitHub
  config:
    import:
      - optional:classpath:application-local.yml

  # Cấu hình tải file (Multipart upload)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Cấu hình phân trang REST (Page bắt đầu từ 1)
  data:
    web:
      pageable:
        one-indexed-parameters: true

  # Cấu hình Template Engine (Thymeleaf - Dùng cho template email)
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  # Cấu hình gửi mail (SMTP) - Giá trị nhạy cảm để trống, được nạp qua application-local.yml hoặc ENV
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Custom Application Properties
api:
  version: v1

laivu:
  jwt:
    # Secret mẫu cho dev - ở prod bắt buộc cấu hình qua biến môi trường JWT_SECRET hoặc application-local.yml
    base64-secret: ${JWT_SECRET:dGhpc0lzQUR1bW15U2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5Tm90Rm9yUHJvZDEyMzQ1Njc4OTA=}
    # Access Token: mặc định 1 ngày cho dev (86400s), thực tế prod nên để 1800s - 3600s
    access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY:86400}
    # Refresh Token: mặc định 10 ngày (864000s)
    refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_VALIDITY:864000}

  upload-file:
    # Đường dẫn thư mục mặc định (sẽ được ghi đè bởi application-local.yml hoặc biến môi trường)
    base-uri: ${UPLOAD_BASE_URI:file:///./upload/}
